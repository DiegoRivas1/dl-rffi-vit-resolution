experiment:
  name: f4_msvit_multi_r64_s43
  phase: 4
  seed: 43
data:
  preprocess_config: configs/preprocess/manysig_eq1_multi.yaml
resolution:
  train: R64x64
  test:
  - R32x32
  - R64x64
  - R96x64
  - R128x128
model:
  type: msvit
  in_chans: 1
  patch_size: 4
  dims:
  - 64
  - 128
  - 256
  depths:
  - 2
  - 4
  - 2
  head_dim: 32
  mlp_ratio: 4.0
  dropout: 0.1
  rep_kernel: 3
  use_scconv: true
  use_repcpe: true
training:
  epochs: 30
  batch_size: 64
  lr: 0.0003
  weight_decay: 0.05
  warmup_epochs: 2
  label_smoothing: 0.0
  grad_clip: 1.0
  amp: true
  save_every: 1
  patience: 8
  num_workers: 0
output:
  runs_dir: runs
