# FASE 2: ViT de la fase 1 + fine-tuning en R128x128 (se reporta aparte: NO es generalización zero-shot).
experiment:
  name: f2_vit_ft_r128x128
  phase: 2
  seed: 42

data:
  preprocess_config: configs/preprocess/manysig_eq1.yaml

resolution:
  train: R64x64            # resolución de origen del modelo fuente
  finetune: R128x128
  test: [R32x32, R64x64, R96x64, R128x128]

finetune:
  source_run: f1_vit_base_r64
  source_ckpt: best        # best | last

training:
  epochs: 20
  batch_size: 64
  lr: 1.0e-4               # menor que en el entrenamiento desde cero (3e-4)
  weight_decay: 0.05
  warmup_epochs: 1
  label_smoothing: 0.0
  grad_clip: 1.0
  amp: true
  save_every: 1
  patience: 10
  num_workers: 0

output:
  runs_dir: runs
