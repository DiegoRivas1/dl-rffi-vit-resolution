# FASE 4 (robustez): MSViT con 12 receptores, entrenado en 3 fechas y probado en una fecha no vista.
experiment:
  name: f4_msvit_multi_r64_s44
  phase: 4
  seed: 44

data:
  preprocess_config: configs/preprocess/manysig_eq1_multi.yaml

resolution:
  train: R64x64
  test: [R32x32, R64x64, R96x64, R128x128]

model:
  type: msvit
  in_chans: 1
  patch_size: 4            # tamaño del parche de SC-Conv (DCT 4x4)
  dims: [64, 128, 256]     # dimensión por etapa
  depths: [2, 4, 2]        # bloques por etapa
  head_dim: 32             # cabezas = dim / head_dim -> 2, 4, 8
  mlp_ratio: 4.0
  dropout: 0.1
  rep_kernel: 3            # kernel de RepCPE (3 | 5 | 7)
  use_scconv: true         # false -> patch embedding convolucional estándar (ablación)
  use_repcpe: true         # false -> sin información posicional (ablación)

training:
  epochs: 30
  batch_size: 64
  lr: 3.0e-4
  weight_decay: 0.05
  warmup_epochs: 2
  label_smoothing: 0.0
  grad_clip: 1.0
  amp: true
  save_every: 1
  patience: 8 
  num_workers: 0

output:
  runs_dir: runs
